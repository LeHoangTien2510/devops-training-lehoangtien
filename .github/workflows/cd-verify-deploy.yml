# =============================================================================
# CD Pipeline: Verify signature → Deploy to K8s (Helm)
# Trigger: Manual hoặc sau khi CI hoàn thành
# =============================================================================
name: CD - Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'
  workflow_run:
    workflows: ["CI/CD - Supply Chain Security"]
    types: [completed]
    branches: [main, master]

env:
  BACKEND_IMAGE: lehoangtien2510/ecommerce-backend
  FRONTEND_IMAGE: lehoangtien2510/demo-frontend
  TAG: ${{ github.event.inputs.imageTag || github.sha }}

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. Verify Cosign signatures ----------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Backend signature
        run: |
          cosign verify --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
                        --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                        $BACKEND_IMAGE:$TAG \
          || (echo "❌ BACKEND NOT SIGNED - DEPLOY REJECTED" && exit 1)

      - name: Verify Frontend signature
        run: |
          cosign verify --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
                        --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                        $FRONTEND_IMAGE:$TAG \
          || (echo "❌ FRONTEND NOT SIGNED - DEPLOY REJECTED" && exit 1)

      # ---------- 2. Configure kubectl ----------
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          kubectl cluster-info

      # ---------- 3. Deploy with Helm ----------
      - name: Deploy with Helm
        run: |
          echo "✅ All signatures verified - Deploying tag: $TAG"
          helm upgrade --install demo-app ./charts/demo-app \
            --namespace default \
            --set backend.image.tag=$TAG \
            --set frontend.image.tag=$TAG \
            --wait --timeout 5m

      # ---------- 4. Verify deployment ----------
      - name: Verify deployment
        run: |
          echo "============================================"
          echo "  DEPLOYMENT STATUS"
          echo "============================================"
          kubectl get pods -n default -l 'app.kubernetes.io/instance in (demo-app)'
          kubectl get ingress -n default
          echo ""
          echo "ALB DNS:"
          kubectl get ingress -n default ecommerce-ingress -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "(đang provisioning...)"

