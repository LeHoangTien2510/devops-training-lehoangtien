# =============================================================================
# CD Pipeline: Verify signature → Deploy
# =============================================================================
name: CD - Verify & Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to verify (CI commit SHA)'
        required: true
        default: '9fb0800'
  workflow_run:
    workflows: ["CI - Supply Chain Security"]
    types: [completed]
    branches: [main, master]

env:
  IMAGE: lehoangtien2510/ecommerce-backend
  TAG: ${{ inputs.tag || github.sha }}

jobs:
  verify-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # ---------- 1. Cài Cosign ----------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # ---------- 2. Verify signature → REJECT nếu không có ----------
      - name: Verify image signature
        run: |
          cosign verify --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
                        --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                        $IMAGE:$TAG \
          || (echo "❌ IMAGE NOT SIGNED - DEPLOY REJECTED" && exit 1)

      # ---------- 3. Deploy (sau khi verify pass) ----------
      - name: Deploy to Kubernetes
        run: |
          echo "✅ Signature verified - Deploying..."
          # kubectl set image deployment/demo-app demo-app=$IMAGE:$TAG
