# =============================================================================
# CI/CD Pipeline: Scan → SBOM → Sign → Verify (Backend + Frontend)
# =============================================================================
name: CI/CD - Supply Chain Security

on:
  push:
    branches: [main, master, Week-4-progress-4]
  pull_request:

permissions:
  id-token: write   # ← cần cho Cosign keyless OIDC
  contents: read

env:
  BACKEND_IMAGE: lehoangtien2510/ecommerce-backend
  FRONTEND_IMAGE: lehoangtien2510/demo-frontend
  TAG: ${{ github.sha }}

jobs:
  # ======================== BACKEND ========================
  security-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend image
        run: docker build -f src/02-backend_spring-boot-rest-api/Dockerfile -t $BACKEND_IMAGE:$TAG src/02-backend_spring-boot-rest-api/

      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
          format: table
          output: trivy-backend.txt
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Show Backend scan
        run: cat trivy-backend.txt

      - name: Upload Backend scan
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend
          path: trivy-backend.txt

      - name: SBOM Backend
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ env.TAG }}
          format: cyclonedx-json
          output-file: sbom-backend.json

      - name: Upload SBOM Backend
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.json

      - name: Push Backend
        run: docker push $BACKEND_IMAGE:$TAG

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Backend (keyless)
        run: cosign sign --yes $BACKEND_IMAGE:$TAG
        env:
          COSIGN_EXPERIMENTAL: 1

  # ======================== FRONTEND ========================
  security-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend image
        run: docker build -f src/03-frontend_angular-ecommerce/Dockerfile -t $FRONTEND_IMAGE:$TAG src/03-frontend_angular-ecommerce/

      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
          format: table
          output: trivy-frontend.txt
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Show Frontend scan
        run: cat trivy-frontend.txt

      - name: Upload Frontend scan
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend
          path: trivy-frontend.txt

      - name: SBOM Frontend
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
          format: cyclonedx-json
          output-file: sbom-frontend.json

      - name: Upload SBOM Frontend
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: sbom-frontend.json

      - name: Push Frontend
        run: docker push $FRONTEND_IMAGE:$TAG

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Frontend (keyless)
        run: cosign sign --yes $FRONTEND_IMAGE:$TAG
        env:
          COSIGN_EXPERIMENTAL: 1

  # ======================== CD: Verify & Deploy ========================
  verify-deploy:
    needs: [security-backend, security-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Backend signature
        run: |
          cosign verify --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
                        --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                        $BACKEND_IMAGE:$TAG \
          || (echo "❌ BACKEND NOT SIGNED - DEPLOY REJECTED" && exit 1)

      - name: Verify Frontend signature
        run: |
          cosign verify --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
                        --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                        $FRONTEND_IMAGE:$TAG \
          || (echo "❌ FRONTEND NOT SIGNED - DEPLOY REJECTED" && exit 1)

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install demo-app ./charts/demo-app \
            --namespace default \
            --set backend.image.tag=$TAG \
            --set frontend.image.tag=$TAG \
            --wait --timeout 5m
