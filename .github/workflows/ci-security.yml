# =============================================================================
# CI Pipeline: Scan → SBOM → Sign
# =============================================================================
name: CI - Supply Chain Security

on:
  push:
    branches: [main, master, Week-4-progress-4]
  pull_request:

env:
  IMAGE: lehoangtien2510/ecommerce-backend
  TAG: ${{ github.sha }}

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 1. Login Docker Hub ----------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------- 2. Build image ----------
      - name: Build Docker image
        run: docker build -f Week-4-terraform/Fullstack-Ecommerce-Web/02-backend_spring-boot-rest-api/Dockerfile -t $IMAGE:$TAG Week-4-terraform/Fullstack-Ecommerce-Web/02-backend_spring-boot-rest-api/

      # ---------- 3. Trivy scan (table format → hiện CVE ra log) ----------
      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: table
          output: trivy-results.txt
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Show scan results
        run: cat trivy-results.txt

      # ---------- 4. Tạo SBOM bằng Syft ----------
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      # ---------- 5. Cosign keyless sign (GitHub OIDC) ----------
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        run: cosign sign --yes $IMAGE:$TAG
        env:
          COSIGN_EXPERIMENTAL: 1

      # ---------- 6. Push image ----------
      - name: Push image
        run: docker push $IMAGE:$TAG
