# =============================================================================
# Angular Frontend
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-frontend
  template:
    metadata:
      labels:
        app: ecommerce-frontend
    spec:
      containers:
        - name: frontend
          image: <AWS_ACCOUNT>.dkr.ecr.us-east-1.amazonaws.com/ecommerce-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-frontend
  namespace: default
spec:
  selector:
    app: ecommerce-frontend
  ports:
    - port: 80
      targetPort: 80
