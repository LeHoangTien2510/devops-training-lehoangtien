# =============================================================================
# ConfigMap - application.properties cho Spring Boot
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-backend-config
  namespace: default
data:
  application.properties: |
    # ===== MySQL (K8s service name) =====
    spring.datasource.url=jdbc:mysql://mysql:3306/full-stack-ecommerce
    spring.datasource.username=ecommerceapp
    spring.datasource.password=StrongPa55WorD
    spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

    # ===== JPA / Hibernate =====
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
    spring.jpa.hibernate.ddl-auto=none
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true

    # ===== REST API base path =====
    spring.data.rest.base-path=/api

    # ===== CORS (cho phép frontend) =====
    allowed.origins=http://localhost:4200

    # ===== Okta OAuth2 =====
    okta.oauth2.client-id=0oab0lzwjoN1Rjsar5d7
    okta.oauth2.issuer=https://dev-82108115.okta.com/oauth2/default
