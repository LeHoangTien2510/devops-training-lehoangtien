# =============================================================================
# Backstage – Internal Developer Portal
# Cài: helm upgrade --install backstage backstage/backstage -n backstage -f values.yaml
# =============================================================================

# Backstage server configuration
backstage:
  image:
    registry: docker.io
    repository: backstageio/backstage
    tag: latest

  service:
    type: ClusterIP
    port: 7007

  # App config (catalog locations, integrations)
  appConfig:
    app:
      title: DevOps Platform
      baseUrl: http://localhost:7007
    organization:
      name: DevOps Training
    backend:
      baseUrl: http://localhost:7007
      cors:
        origin: http://localhost:7007
    catalog:
      locations:
        - type: url
          target: https://github.com/LeHoangTien2510/devops-training-lehoangtien/blob/Week-7-GoldenPath/platform/catalog-info.yaml
    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

  extraEnv:
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: backstage-github-token
          key: GITHUB_TOKEN

# Ingress for external access
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
