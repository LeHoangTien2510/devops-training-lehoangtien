# Golden Path Sample Service
appName: sample-service
namespace: demo-app
image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 80
replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
monitoring:
  enabled: false
