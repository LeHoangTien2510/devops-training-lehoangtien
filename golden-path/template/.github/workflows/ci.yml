# =============================================================================
# Golden Path CI Pipeline – GitHub Actions
# Build → Test → Push → Sign (Cosign) → Update GitOps
# Dev chỉ push code, mọi thứ tự động
# =============================================================================
name: CI Pipeline

on:
  push:
    branches: [main, Week-*]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}

jobs:
  # ─── 1. Test ───
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          echo "🧪 Running unit tests..."
          # Thay bằng lệnh test thực tế: npm test, go test, mvn test...
          echo "✅ Tests passed"

  # ─── 2. Build & Push + Cosign Sign ───
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # Cần cho Cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      # ─── Cosign Sign (keyless – OIDC) ───
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: 1   # Keyless signing qua GitHub OIDC

  # ─── 3. Update GitOps (báo ArgoCD biết tag mới) ───
  update-gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LeHoangTien2510/devops-training-lehoangtien
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Update image tag in Helm values
        run: |
          cd gitops-repo
          # Tìm file values.yaml của service này trong golden-path/apps/
          VALUES_FILE="golden-path/apps/${{ github.event.repository.name }}/values.yaml"
          if [ -f "$VALUES_FILE" ]; then
            sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" "$VALUES_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$VALUES_FILE"
            git commit -m "ci: update ${{ github.event.repository.name }} to ${{ github.sha }}"
            git push
            echo "✅ GitOps updated → ArgoCD will auto-sync"
          else
            echo "⚠️  $VALUES_FILE not found – skipping GitOps update"
          fi
