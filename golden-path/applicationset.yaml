# =============================================================================
# ApplicationSet: Tự động tạo ArgoCD Application cho mọi thư mục con
# trong golden-path/apps/
#
# DevOps: maintain golden-path/shared-chart/ (Helm chart dùng chung)
# Dev:    chỉ cần tạo 1 file values.yaml trong golden-path/apps/<app>/
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: golden-path-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/LeHoangTien2510/devops-training-lehoangtien
        revision: Week-7-GoldenPath
        directories:
          - path: golden-path/apps/*
  template:
    metadata:
      name: 'golden-{{.path.basename}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/LeHoangTien2510/devops-training-lehoangtien
        targetRevision: Week-7-GoldenPath
        # Shared chart (DevOps maintain) + per-app values (Dev tạo)
        path: golden-path/shared-chart
        helm:
          valueFiles:
            - ../../golden-path/apps/{{.path.basename}}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: demo-app
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
