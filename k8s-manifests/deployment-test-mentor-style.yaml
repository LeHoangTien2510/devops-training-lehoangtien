# =============================================================================
# Deployment test theo đúng style mentor (kubectl set image deployment.apps)
# Tên khớp convention mentor:
#   namespace      = demo-app-dev-ns
#   deploymentName = demo-app-dev-deployment
#   containerName  = demo-app-dev-container
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app-dev-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-dev-deployment
  namespace: demo-app-dev-ns
  labels:
    app: demo-app-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app-dev
  template:
    metadata:
      labels:
        app: demo-app-dev
    spec:
      containers:
        - name: demo-app-dev-container
          image: lehoangtien2510/ecommerce-backend:dev-1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
