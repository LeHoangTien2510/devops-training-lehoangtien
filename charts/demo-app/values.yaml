# =============================================================================
# Default values for demo-app (3-tier: Angular + Spring Boot + MySQL)
# Jenkins sẽ tự động cập nhật tag image khi build xong
# =============================================================================
namespace: demo-app-dev
environment: dev

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
  # 🔐 Secrets được Jenkins quản lý: kubectl create secret mysql-secret
  #    (đọc từ Vault: secret/demo-app/mysql)
  auth:
    database: "full-stack-ecommerce"
    username: "ecommerceapp"
  service:
    name: mysql
    port: 3306
  persistence:
    enabled: true
    storageClass: gp3
    size: 5Gi
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }

backend:
  enabled: true
  image:
    repository: lehoangtien2510/ecommerce-backend
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  service:
    name: ecommerce-backend
    port: 8080
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  springDatasourceUrl: "jdbc:mysql://mysql:3306/full-stack-ecommerce"
  allowedOrigins: "*"

frontend:
  enabled: true
  image:
    repository: lehoangtien2510/ecommerce-frontend
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  service:
    name: ecommerce-frontend
    port: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }

ingress:
  enabled: true
  name: ecommerce-ingress
  className: alb
  scheme: internet-facing
  targetType: ip
  tls:
    enabled: false
    secretName: ecommerce-tls
  host: ""

serviceMonitor:
  enabled: true
  interval: 30s

certManager:
  enabled: false
  issuerName: selfsigned-issuer

# =============================================================================
# Secrets – Jenkins quản lý toàn bộ (KHÔNG dùng ESO, KHÔNG dùng Helm secret)
# =============================================================================
# Flow:
#   1. Jenkins đọc Vault → vault kv get secret/demo-app/mysql
#   2. Jenkins kubectl create secret generic mysql-secret
#   3. MySQL + Backend đọc mysql-secret từ K8s
# =============================================================================
