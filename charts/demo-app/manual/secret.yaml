# =============================================================================
# Secret: MySQL credentials (static – tạo thủ công trước khi Helm deploy)
# =============================================================================
# KHÔNG commit password thật vào Git!
# Tạo secret bằng lệnh:
#
#   kubectl create secret generic mysql-secret -n demo-app \
#     --from-literal=mysql-root-password=StrongPa55WorD \
#     --from-literal=mysql-database=full-stack-ecommerce \
#     --from-literal=mysql-user=ecommerceapp \
#     --from-literal=mysql-password=StrongPa55WorD
#
# Hoặc apply file này rồi sửa thủ công:
#   kubectl apply -f secret.yaml
#   kubectl edit secret mysql-secret -n demo-app
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: demo-app
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: database
type: Opaque
stringData:
  mysql-root-password: "CHANGE_ME"
  mysql-database: "full-stack-ecommerce"
  mysql-user: "ecommerceapp"
  mysql-password: "CHANGE_ME"
