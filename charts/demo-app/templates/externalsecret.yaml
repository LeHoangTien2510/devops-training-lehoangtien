# =============================================================================
# ExternalSecret: Tự động sync MySQL credentials từ Vault → Kubernetes Secret
# =============================================================================
# Flow:
#   Vault (secret/demo-app/mysql) → ExternalSecret → K8s Secret (mysql-secret)
#
# Yêu cầu:
#   - External Secrets Operator đã cài trong cluster
#   - Vault đã được cấu hình Kubernetes auth
#   - SecretStore "vault-backend" đã được tạo (xem secretstore.yaml)
# =============================================================================
{{- if .Values.vault.enabled }}
---
# ============================================================
# SecretStore: Khai báo kết nối đến Vault
# ============================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"  # Wave -2: Trước ExternalSecret
spec:
  provider:
    vault:
      server: {{ .Values.vault.address | quote }}
      path: {{ .Values.vault.path | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.authMount | quote }}
          role: {{ .Values.vault.role | quote }}
          serviceAccountRef:
            name: {{ .Values.vault.serviceAccount | quote }}

---
# ============================================================
# ExternalSecret: MySQL credentials
# ============================================================
{{- if .Values.mysql.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysql-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "demo-app.mysqlLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Wave -1: Secret trước cả MySQL
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | quote }}
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: mysql-secret              # ← Tên K8s Secret sẽ được tạo
    creationPolicy: Owner           # ESO sở hữu & quản lý secret này
  data:
    - secretKey: mysql-root-password
      remoteRef:
        key: {{ .Values.vault.secretPath.mysql | quote }}
        property: root-password
    - secretKey: mysql-database
      remoteRef:
        key: {{ .Values.vault.secretPath.mysql | quote }}
        property: database
    - secretKey: mysql-user
      remoteRef:
        key: {{ .Values.vault.secretPath.mysql | quote }}
        property: username
    - secretKey: mysql-password
      remoteRef:
        key: {{ .Values.vault.secretPath.mysql | quote }}
        property: password
{{- end }}
{{- end }}
