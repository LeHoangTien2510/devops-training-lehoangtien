# =============================================================================
# Ingress: ALB + TLS (cert-manager)
# =============================================================================
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # Wave 2: Ingress cùng Frontend
    # ALB Ingress Controller
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.targetType }}
    {{- if .Values.ingress.tls.enabled }}
    # TLS với cert-manager
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}, {"HTTP": 80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: ""  # Để ALB tự động gán cert từ ACM (nếu có)
    # cert-manager annotation (nếu dùng cert-manager thay vì ACM)
    cert-manager.io/cluster-issuer: {{ .Values.certManager.issuerName }}
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    {{- end }}
    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /api
    alb.ingress.kubernetes.io/healthcheck-port: "8080"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.host }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host }}
    {{- else }}
    - http:
    {{- end }}
        paths:
          # Grafana monitoring
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
          # Frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.frontend.service.name }}
                port:
                  number: {{ .Values.frontend.service.port }}
          # Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backend.service.name }}
                port:
                  number: {{ .Values.backend.service.port }}
{{- end }}
