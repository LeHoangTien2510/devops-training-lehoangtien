# =============================================================================
# Preview Service: Test Green version (Blue-Green)
# =============================================================================
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.service.name }}-preview
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "demo-app.frontendLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: ecommerce-frontend
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.frontend.service.port }}
      protocol: TCP
{{- end }}
