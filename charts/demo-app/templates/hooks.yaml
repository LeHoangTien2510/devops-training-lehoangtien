# =============================================================================
# ArgoCD Sync Hooks: PreSync Backup + PostSync Health Check + SyncFail Alert
# =============================================================================

# =============================================================================
# PreSync Hook: Backup MySQL trước khi deploy
# =============================================================================
{{- if .Values.mysql.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: presync-db-backup
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: backup
          image: mysql:{{ .Values.mysql.image.tag }}
          command:
            - sh
            - -c
            - |
              echo "📦 [PreSync] Backup MySQL..."
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              FILE="/tmp/backup-${TIMESTAMP}.sql"
              mysqldump -h {{ .Values.mysql.service.name }} \
                -u {{ .Values.mysql.auth.username }} \
                -p$MYSQL_PASSWORD \
                {{ .Values.mysql.auth.database }} \
                > "$FILE" 2>/dev/null && echo "✅ Backup saved: $FILE ($(wc -c < $FILE) bytes)" || echo "⚠️ DB chưa có, bỏ qua backup"
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
                  optional: true
{{- end }}

---
# =============================================================================
# PostSync Hook: Health check Backend + Frontend sau deploy
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: postsync-health-check
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: healthcheck
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              echo "🏥 [PostSync] Health check sau deploy..."
              echo "→ Check Backend..."
              for i in $(seq 1 10); do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 http://{{ .Values.backend.service.name }}:{{ .Values.backend.service.port }}/ 2>/dev/null || echo "000")
                if [ "$STATUS" != "000" ]; then
                  echo "  ✅ Backend HTTP $STATUS (attempt $i)"
                  break
                fi
                echo "  ⏳ Attempt $i/10: HTTP $STATUS, retrying..."
                sleep 10
                [ $i -eq 10 ] && echo "  ❌ Backend not responding" && exit 1
              done
              echo "→ Check Frontend..."
              for i in $(seq 1 5); do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 http://{{ .Values.frontend.service.name }}:{{ .Values.frontend.service.port }}/ 2>/dev/null || echo "000")
                if [ "$STATUS" != "000" ]; then
                  echo "  ✅ Frontend HTTP $STATUS (attempt $i)"
                  exit 0
                fi
                echo "  ⏳ Attempt $i/5: HTTP $STATUS, retrying..."
                sleep 5
              done
              echo "  ❌ Frontend not responding"
              exit 1

---
# =============================================================================
# SyncFail Hook: Thông báo khi sync thất bại
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: syncfail-notify
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: notify
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              echo "🚨 [SyncFail] Deployment thất bại!"
              echo "Env: {{ .Values.environment }}"
              echo "App: {{ .Values.namespace }}"
              echo "Kiểm tra ArgoCD UI để xem lỗi chi tiết."
