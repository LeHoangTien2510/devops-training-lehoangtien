# =============================================================================
# Secret: MySQL credentials (fallback – chỉ dùng khi không có Vault)
# =============================================================================
# Khi vault.enabled=true, dùng externalsecret.yaml thay vì file này.
{{- if and .Values.mysql.enabled (not .Values.vault.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  mysql-root-password: {{ .Values.mysql.auth.rootPassword | quote }}
  mysql-database: {{ .Values.mysql.auth.database | quote }}
  mysql-user: {{ .Values.mysql.auth.username | quote }}
  mysql-password: {{ .Values.mysql.auth.password | quote }}
{{- end }}
