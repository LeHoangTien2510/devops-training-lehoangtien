# =============================================================================
# ServiceMonitor cho NGINX Ingress Controller
# CẦN label "release: kube-prometheus-stack" để Prometheus scrape
# =============================================================================
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nginx-ingress-controller
  namespace: {{ .Values.namespace }}
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: ingress-nginx
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
  namespaceSelector:
    matchNames:
      - ingress-nginx
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
{{- end }}
