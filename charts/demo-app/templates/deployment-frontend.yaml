# =============================================================================
# Deployment: Frontend (đổi từ Rollout sang Deployment theo style mentor)
# =============================================================================
{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.deploymentName | default .Values.frontend.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "demo-app.frontendLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: ecommerce-frontend
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app: ecommerce-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: {{ .Values.frontend.containerName | default "frontend" }}
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}
