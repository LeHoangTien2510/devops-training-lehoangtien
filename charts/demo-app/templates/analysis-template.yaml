# =============================================================================
# AnalysisTemplate: Auto-rollback nếu error rate > 5%
# Gắn vào backend Rollout qua strategy.canary.steps[].analysis
# Yêu cầu: Prometheus (kube-prometheus-stack) đã cài trong namespace monitoring
#          Backend expose /actuator/prometheus (Micrometer)
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-error-rate-check
  namespace: {{ .Values.namespace }}
spec:
  metrics:
    - name: error-rate
      interval: 30s
      count: 3
      # len(result) == 0 → không có data (chưa có traffic) = pass
      # result[0] < 0.05 → error rate dưới 5% = pass
      successCondition: len(result) == 0 || result[0] < 0.05
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.demo-app:9090
          query: |
            rate(http_server_requests_seconds_count{status=~"5..",job="ecommerce-backend"}[1m])
            /
            rate(http_server_requests_seconds_count{job="ecommerce-backend"}[1m])
