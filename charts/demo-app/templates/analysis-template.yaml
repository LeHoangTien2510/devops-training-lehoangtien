# =============================================================================
# AnalysisTemplate: Đánh giá error rate qua NGINX Ingress Controller
# Đo ở tầng Ingress (F5 NGINX) thay vì actuator → kể cả backend chết cũng có metric
# Yêu cầu: NGINX Ingress Controller đã cài + bật metrics + ServiceMonitor
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-error-rate-check
  namespace: {{ .Values.namespace }}
spec:
  metrics:
    - name: error-rate
      interval: 15s
      count: 4                  # đo 4 lần × 15s = 60s
      # error rate < 1% → pass; >= 5% liên tiếp 3 lần → fail → auto rollback
      successCondition: result[0] < 0.01
      failureCondition: result[0] >= 0.05
      failureLimit: 3
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.demo-app:9090
          query: |
            (
              sum(rate(nginx_ingress_controller_requests{namespace="{{ .Values.namespace }}", exported_service="ecommerce-backend", status=~"5.."}[2m]))
              /
              clamp_min(sum(rate(nginx_ingress_controller_requests{namespace="{{ .Values.namespace }}", exported_service="ecommerce-backend"}[2m])), 1)
            ) or vector(0)
