# =============================================================================
# AnalysisTemplate: Auto-rollback nếu error rate > 5%
# Cần Prometheus để hoạt động (tạm thời chưa dùng)
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-error-rate-check
  namespace: {{ .Values.namespace }}
spec:
  metrics:
    - name: error-rate
      interval: 30s
      count: 3
      successCondition: result[0] < 0.05
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.demo-app:9090
          query: |
            rate(http_server_requests_seconds_count{status=~"5.."}[1m])
            /
            rate(http_server_requests_seconds_count[1m])
