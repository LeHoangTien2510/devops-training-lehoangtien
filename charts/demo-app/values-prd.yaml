# =============================================================================
# PRODUCTION values for demo-app
# Promotion: Jenkins job "Promote to PRD" sẽ cập nhật tag
# =============================================================================
namespace: demo-app-prd
environment: prd

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
  auth:
    database: "full-stack-ecommerce"
    username: "ecommerceapp"
  service:
    name: mysql
    port: 3306
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }

backend:
  enabled: true
  image:
    repository: lehoangtien2510/ecommerce-backend
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  service:
    name: ecommerce-backend
    port: 8080
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  springDatasourceUrl: "jdbc:mysql://mysql:3306/full-stack-ecommerce"
  allowedOrigins: "*"

frontend:
  enabled: true
  image:
    repository: lehoangtien2510/ecommerce-frontend
    tag: latest
    pullPolicy: Always
  replicaCount: 2
  service:
    name: ecommerce-frontend
    port: 80
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }

ingress:
  enabled: true
  name: ecommerce-ingress
  className: alb
  scheme: internet-facing
  targetType: ip
  tls:
    enabled: false
    secretName: ecommerce-tls
  host: ""

serviceMonitor:
  enabled: false
  interval: 30s

certManager:
  enabled: false
  issuerName: selfsigned-issuer

# =============================================================================
# Vault Integration – External Secrets Operator
# =============================================================================
vault:
  enabled: false
  address: "http://vault.vault.svc.cluster.local:8200"
  path: "secret"
  authMount: "kubernetes"
  role: "demo-app"
  serviceAccount: "demo-app"
  refreshInterval: "1h"
  secretPath:
    mysql: "secret/demo-app/mysql"
