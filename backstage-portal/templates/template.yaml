# =============================================================================
# Backstage Software Template: IaC All-in-One
# =============================================================================
# Cho phép chọn Project → Environment → Components → Terraform Apply
# Tất cả biến infrastructure được đọc từ Vault
# =============================================================================
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: iac-allinone
  title: 🏗️ IaC All-in-One – Deploy Infrastructure
  description: |
    Chọn project → chọn môi trường → chọn components → Terraform tự động apply.
    Tất cả biến infrastructure (VPC CIDR, instance type, node count,...) 
    được đọc từ Vault theo path: secret/{env}/infrastructure
  tags:
    - infrastructure
    - terraform
    - vault
    - aws
  links:
    - title: Jenkins Pipeline
      url: http://jenkins:8080/job/iac-allinone
      icon: dashboard

spec:
  owner: platform-team
  type: infrastructure
  lifecycle: production

  # ════════════════════════════════════════════════════════════
  # STEP 1: Chọn Project + Environment
  # ════════════════════════════════════════════════════════════
  parameters:
    - title: "📋 Step 1: Project & Environment"
      required:
        - project_name
        - environment
      properties:
        project_name:
          title: Project Name
          type: string
          description: "Nhập tên project muốn triển khai infrastructure"
          default: demo-app
          ui:autofocus: true

        environment:
          title: Environment
          type: string
          description: Môi trường cần triển khai
          enum:
            - dev
            - stg
            - prd
          default: dev
          ui:widget: radio

    # ════════════════════════════════════════════════════════════
    # STEP 2: Chọn Components (Infrastructure Layers)
    # ════════════════════════════════════════════════════════════
    - title: "📦 Step 2: Infrastructure Components"
      required:
        - components
      properties:
        components:
          title: Layers to Deploy
          type: array
          description: Chọn các tầng infrastructure cần triển khai (theo thứ tự)
          items:
            type: string
            enum:
              - network
              - compute
              - jenkins
              - rancher
            enumNames:
              - "🌐 Network (VPC + Subnets)"
              - "☸️  Compute (EKS + Vault + ArgoCD)"
              - "🔧 Jenkins (CI/CD Server)"
              - "🐄 Rancher (Cluster Manager)"
          uniqueItems: true
          default:
            - network
            - compute
          ui:widget: checkboxes

        action:
          title: Terraform Action
          type: string
          description: Plan = xem trước thay đổi, Apply = triển khai thật
          enum:
            - plan
            - apply
          default: plan
          ui:widget: radio

    # ════════════════════════════════════════════════════════════
    # STEP 3: Preview Vault (mở tab riêng để xem + refresh)
    # ════════════════════════════════════════════════════════════
    - title: "🔐 Step 3: Verify Infrastructure Config"
      properties:
        vault_url:
          title: "🔗 Open Vault Config in new tab"
          type: string
          description: |
            Mở link này trong tab mới để xem config từ Vault.
            Đổi dev/stg/prd để kiểm tra từng môi trường.
            Có thể refresh để load lại.
          default: "http://localhost:7070/api/iac-vault/dev/infrastructure"
          ui:help: |
            💡 Mở link trên trong tab mới → thấy JSON config thật từ Vault.
            Đổi /dev/ thành /stg/ hoặc /prd/ để kiểm tra môi trường khác.

  # ════════════════════════════════════════════════════════════
  # STEPS: Backend thực thi
  # ════════════════════════════════════════════════════════════
  steps:
    # Chạy Terraform (đọc Vault + gen tfvars + apply)
    - id: terraform
      name: 🚀 Deploy Infrastructure
      action: iac:terraform
      input:
        environment: ${{ parameters.environment }}
        layers: ${{ parameters.components }}
        action: ${{ parameters.action }}
        project_name: ${{ parameters.project_name }}

  output:
    links:
      - title: View in AWS Console
        url: https://us-east-1.console.aws.amazon.com
      - title: Jenkins Pipeline Log
        url: http://localhost:8080/job/iac-allinone
    text:
      - title: "✅ Infrastructure ${{ parameters.action }} completed"
        content: |
          Project: ${{ parameters.project_name }}
          Environment: ${{ parameters.environment }}
          Layers: ${{ join(parameters.components, ', ') }}
          Action: ${{ parameters.action }}
