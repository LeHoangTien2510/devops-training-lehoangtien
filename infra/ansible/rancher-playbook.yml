---
# =============================================================================
# Ansible Playbook: Cài đặt Rancher Server trên EC2
# =============================================================================
# Chạy: ansible-playbook -i inventory.ini rancher-playbook.yml
# =============================================================================
- name: Provision Rancher Server
  hosts: rancher
  become: yes
  vars:
    rancher_version: "latest"
    rancher_container_name: rancher
    rancher_data_dir: /var/lib/rancher

  tasks:
    # ============================================================
    # 1. CÀI DOCKER (nếu chưa có)
    # ============================================================
    - name: Kiểm tra Docker
      command: docker --version
      register: docker_check
      changed_when: false
      ignore_errors: true

    - name: Cài Docker nếu thiếu
      block:
        - name: Đợi apt lock (user_data có thể đang chạy)
          shell: while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
          changed_when: false

        - name: Update apt
          apt:
            update_cache: yes
            cache_valid_time: 3600

        - name: Cài Docker
          shell: curl -fsSL https://get.docker.com | bash
          args:
            creates: /usr/bin/docker

        - name: Khởi động Docker
          systemd:
            name: docker
            state: started
            enabled: yes

        - name: Thêm ubuntu vào docker group
          user:
            name: ubuntu
            groups: docker
            append: yes
      when: docker_check.rc != 0

    # ============================================================
    # 2. TẠO THƯ MỤC DỮ LIỆU RANCHER
    # ============================================================
    - name: Tạo thư mục Rancher data
      file:
        path: "{{ rancher_data_dir }}"
        state: directory
        mode: "0755"

    # ============================================================
    # 3. CHẠY RANCHER CONTAINER
    # ============================================================
    - name: Dừng Rancher cũ (nếu có)
      command: docker rm -f {{ rancher_container_name }}
      ignore_errors: true
      changed_when: false

    - name: Pull Rancher image
      command: docker pull rancher/rancher:{{ rancher_version }}
      register: pull_result
      changed_when: "'Downloaded newer image' in pull_result.stdout or 'Pull complete' in pull_result.stdout"

    - name: Chạy Rancher container
      command: >
        docker run -d
        --name {{ rancher_container_name }}
        --restart unless-stopped
        --privileged
        -p 80:80
        -p 443:443
        -v {{ rancher_data_dir }}:/var/lib/rancher
        rancher/rancher:{{ rancher_version }}
      register: rancher_container

    - name: Đợi Rancher khởi động (60s)
      wait_for:
        port: 443
        delay: 60
        timeout: 180

    # ============================================================
    # 4. LẤY BOOTSTRAP PASSWORD
    # ============================================================
    - name: Lấy Rancher bootstrap password
      shell: >
        docker logs {{ rancher_container_name }} 2>&1 |
        grep "Bootstrap Password:" |
        tail -1 |
        awk '{print $NF}'
      register: bootstrap_password
      changed_when: false
      ignore_errors: true

    - name: Hiển thị thông tin truy cập
      debug:
        msg:
          - "============================================"
          - "🐮 RANCHER ĐÃ SẴN SÀNG!"
          - "URL:                https://{{ ansible_default_ipv4.address }}.sslip.io"
          - "Bootstrap Password: {{ bootstrap_password.stdout | default('(chưa có, đợi thêm)') }}"
          - "============================================"
          - ""
          - "👉 Sau khi mở web, làm theo hướng dẫn:"
          - "   1. Nhập bootstrap password"
          - "   2. Đặt admin password mới"
          - "   3. Vào Cluster Management → Import Existing Cluster"
          - "   4. Chọn Generic → đặt tên cluster"
          - "   5. Chạy lệnh kubectl apply hiển thị trên web để import EKS"
