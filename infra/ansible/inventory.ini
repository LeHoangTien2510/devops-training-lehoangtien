# =============================================================================
# Ansible Inventory – Jenkins + Rancher
# =============================================================================
# Cập nhật IP thật từ Terraform output, sau đó chạy playbook:
#
#   ansible-playbook -i inventory.ini jenkins-playbook.yml
#   ansible-playbook -i inventory.ini rancher-playbook.yml
#
# Lấy IP:
#   cd infra/envs/dev/jenkins && terraform output public_ip
#   cd infra/envs/dev/rancher  && terraform output public_ip
# =============================================================================

[jenkins]
jenkins-server ansible_host=54.210.164.98 ansible_user=ubuntu

[rancher]
rancher-server ansible_host=52.4.186.152 ansible_user=ubuntu

[all:vars]
ansible_ssh_private_key_file=~/work/devops-training-lehoangtien/KeyPair-2.pem
ansible_python_interpreter=/usr/bin/python3
