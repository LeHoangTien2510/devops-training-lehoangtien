# =============================================================================
# Vault Helm Values – HA mode với Raft storage + Internal NLB cho Jenkins
# =============================================================================
# Usage: helm install vault hashicorp/vault -n vault -f vault-values.yaml
#
# Kiến trúc:
#   Vault (HA x3, Raft) → Internal NLB → Jenkins EC2 (cùng VPC)
#   Jenkins dùng AppRole auth để đọc secret, sau đó tạo K8s Secret qua kubectl
#
# KHÔNG dùng ESO nữa – Jenkins trực tiếp quản lý secret lifecycle

global:
  enabled: true
  tlsDisable: true  # Lab: tắt TLS cho đơn giản; Production PHẢI bật

server:
  # Chỉ dùng 1 LoadBalancer (vault service), không tạo vault-active/vault-standby
  service:
    enabled: true
  # Tắt extra service để tiết kiệm NLB
  standalone:
    enabled: false

  # HA mode: 3 nodes, nhưng chỉ 1 NLB
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address     = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}

  # Auth backends (khai báo trong config để vault tự động enable)
  # AppRole: cho Jenkins machine-to-machine auth
  # Kubernetes: giữ lại cho fallback / tooling

  # Resources
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # Data persistence
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: gp3

  # =========================================================================
  # Service: Internal NLB → Jenkins EC2 có thể gọi từ trong VPC
  # =========================================================================
  service:
    enabled: true
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    ports:
      - name: http
        port: 8200
        targetPort: 8200
        protocol: TCP

  # UI
  ui:
    enabled: true
    serviceType: ClusterIP

# =========================================================================
# Vault Agent Injector – tự động inject secret vào Pod qua sidecar
# =========================================================================
# Flow: Pod có annotation vault.hashicorp.com/agent-inject=true
#       → Mutating Webhook thêm init container + sidecar
#       → Sidecar auth với Vault (K8s SA) → ghi secret vào file
#       → App container đọc từ file (/vault/secrets/...)
# Injector (không dùng – Jenkins tự tạo K8s Secret)
injector:
  enabled: false
