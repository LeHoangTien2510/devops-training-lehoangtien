# =============================================================================
# Vault Helm Values – HA mode với Raft storage
# =============================================================================
# Usage: helm install vault hashicorp/vault -n vault -f vault-values.yaml

global:
  enabled: true
  tlsDisable: true  # Lab: tắt TLS cho đơn giản; Production PHẢI bật

server:
  # HA mode: 3 nodes
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address     = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}

  # Resources
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # Data persistence
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: gp3

  # Service
  service:
    enabled: true
    type: ClusterIP

  # UI
  ui:
    enabled: true
    serviceType: ClusterIP

# Injector (sidecar – optional, dùng ESO là chính)
injector:
  enabled: false
